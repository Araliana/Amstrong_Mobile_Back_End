name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  go_router: ^17.0.1
  http: ^1.6.0
  bcrypt: ^1.2.0
  image_picker: ^1.2.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_analytics: ^12.1.1
  google_mobile_ads: ^7.0.0
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.7
  cloud_firestore: ^6.1.2
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  
  flutter_localizations:  
    sdk: flutter
    
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/adaptive_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: Adelia
      fonts:
        - asset: assets/fonts/adelia.ttf
